<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="An appam on a steel plate">
  <defs>
    <radialGradient id="appamBody" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0%" stop-color="#fffdf6" />
      <stop offset="52%" stop-color="#fdf4dd" />
      <stop offset="82%" stop-color="#f0dfb0" />
      <stop offset="100%" stop-color="#d9bd7f" />
    </radialGradient>
    <radialGradient id="appamCentre" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#fffefb" />
      <stop offset="100%" stop-color="#fdf6e4" />
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ecef" />
      <stop offset="45%" stop-color="#c3cbd2" />
      <stop offset="100%" stop-color="#9aa4ad" />
    </linearGradient>
    <radialGradient id="tableShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00000030" />
      <stop offset="100%" stop-color="#00000000" />
    </radialGradient>
  </defs>

  <!-- banana-leaf-green table -->
  <rect width="800" height="800" fill="#2f5d3a" />
  <rect width="800" height="800" fill="#00000018" />

  <!-- steel plate -->
  <ellipse cx="400" cy="430" rx="330" ry="300" fill="url(#tableShade)" />
  <ellipse cx="400" cy="415" rx="308" ry="278" fill="url(#plate)" />
  <ellipse cx="400" cy="415" rx="270" ry="243" fill="none" stroke="#ffffff55" stroke-width="6" />
  <ellipse cx="400" cy="415" rx="252" ry="226" fill="#b9c2c9" />

  <!-- appam: lacy thin rim, thick soft middle -->
  <ellipse cx="400" cy="408" rx="246" ry="220" fill="url(#appamBody)" />
  <ellipse cx="400" cy="400" rx="150" ry="134" fill="url(#appamCentre)" />

  <!-- browned lacy edge, the bit everyone fights over -->
  <g fill="#c9a05e" opacity="0.55">
    <circle cx="400" cy="190" r="9" />
    <circle cx="500" cy="205" r="7" />
    <circle cx="580" cy="255" r="8" />
    <circle cx="628" cy="330" r="7" />
    <circle cx="644" cy="415" r="9" />
    <circle cx="620" cy="500" r="7" />
    <circle cx="566" cy="565" r="8" />
    <circle cx="486" cy="608" r="7" />
    <circle cx="400" cy="624" r="9" />
    <circle cx="314" cy="608" r="7" />
    <circle cx="234" cy="565" r="8" />
    <circle cx="180" cy="500" r="7" />
    <circle cx="156" cy="415" r="9" />
    <circle cx="172" cy="330" r="7" />
    <circle cx="220" cy="255" r="8" />
    <circle cx="300" cy="205" r="7" />
  </g>

  <!-- the holes. Somebody, somewhere, is counting these. -->
  <g fill="#e6d3a8" opacity="0.85">
    <circle cx="352" cy="352" r="13" />
    <circle cx="440" cy="336" r="10" />
    <circle cx="470" cy="412" r="14" />
    <circle cx="392" cy="446" r="11" />
    <circle cx="330" cy="420" r="9" />
    <circle cx="424" cy="392" r="8" />
    <circle cx="356" cy="300" r="8" />
    <circle cx="486" cy="356" r="7" />
    <circle cx="306" cy="366" r="7" />
    <circle cx="446" cy="468" r="9" />
    <circle cx="340" cy="482" r="8" />
    <circle cx="512" cy="452" r="8" />
    <circle cx="288" cy="452" r="7" />
    <circle cx="400" cy="264" r="7" />
  </g>

  <!-- soft highlight so it reads as steamed, not baked -->
  <ellipse cx="330" cy="330" rx="86" ry="54" fill="#ffffff" opacity="0.28" transform="rotate(-22 330 330)" />
</svg>
